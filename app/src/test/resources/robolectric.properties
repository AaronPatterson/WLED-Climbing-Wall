# Robolectric defaults to emulating the compileSdk, which here is 37. Android
# 37's startup path reaches into FileDescriptor internals that JDK 25 no longer
# exposes, and Robolectric fails before any test runs with "Failed to interact
# with raw FileDescriptor internals".
#
# Pinned to 34 because nothing these tests exercise depends on the emulated
# Android version: they run SQLite through Room, which behaves the same either
# way. Raise it when Robolectric supports a newer pairing.
sdk=34
